name: Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: SwiftPM and macOS host
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve SwiftPM dependencies
        run: swift package resolve

      - name: Test and build app bundle
        run: scripts/verify-host.sh Release

      - name: Package app artifact
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          .build/HostDerivedData/Build/Products/Release/Tilde.app
          .build/Tilde-macos-ci.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tilde-macos-${{ github.sha }}
          path: .build/Tilde-macos-ci.zip
          if-no-files-found: error
          retention-days: 14
